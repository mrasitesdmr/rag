# AMAÇ: Bu repodaki iki servisin REST API sözleşmesi. Tek doğru kaynak.
# - /api/assistant/**  → assistant-api (konuşma, cevap akışı, geri bildirim, aktarma, değerlendirme)
# - /api/workspaces/** → retrieval-api (kaynak, sürüm, parça, içe alma, vektör arama); hem web hem assistant-api çağırır
# Planner günceller; backend-coder buna göre endpoint yazar, frontend-coder buna göre çağrı yapar, qa uyumu kontrol eder.
# Uyum kontrolünde her servisin /v3/api-docs.yaml çıktısı bu dosyanın kendi path önekiyle karşılaştırılır.
# Cevap akışının (SSE) olayları docs/api/sse.md'dedir; burada sadece akış endpoint'inin kendisi ve akış öncesi hataları tanımlanır.
# Durum: TASK-007. retrieval-api: içe alma işinin durumu (GET .../ingestion-jobs/{jobId}, TASK-005), belge ekleme (POST .../sources),
#   kaynak listesi (GET .../sources) ve başarısız ilk içe almanın yeniden denenmesi (POST .../sources/{sourceId}/ingestion-jobs) (TASK-027),
#   vektör arama (POST .../search, TASK-006; çağıran assistant-api, TASK-008),
#   Bilgi kaynakları ekranının okuma uçları (TASK-007): çalışma alanı (GET /api/workspaces/{workspaceId}), kaynak listesinin ekran alanları,
#   tek kaynak (GET .../sources/{sourceId}), saklanan PDF (GET .../sources/{sourceId}/file), kaynağın içe alma işleri
#   (GET .../sources/{sourceId}/ingestion-jobs), parçalar (GET .../sources/{sourceId}/chunks) ve tek parça (GET .../chunks/{chunkId}).
#   assistant-api (TASK-008): konuşma açma (POST /api/assistant/conversations) ve soru gönderme
#   (POST /api/assistant/conversations/{conversationId}/messages; cevap SSE ile akar, olaylar docs/api/sse.md).
#   TASK-010: sendMessage takip sorusunu retrieval'dan önce geçmişle bağımsız bir arama sorgusuna çevirir (REST şeması
#   değişmedi; arama sorgusu ve yeniden yazma süresi SSE `sources` / `done` olaylarındadır).
#   TASK-011: canlı yapılandırma (GET /api/assistant/live-config; assistant-api, bilgi bankası durumu için retrieval-api'nin
#   GET /api/workspaces/{workspaceId} ve GET .../sources uçlarını çağırır) ve üretim modu Sadece LLM (sendMessage
#   `assistant.generation.mode=llm` iken retrieval yapmaz; olay alanları docs/api/sse.md).
#   TASK-012: Önizleme soru önerileri (GET /api/assistant/suggestions: web okur; PUT /api/assistant/suggestions: ürün ekibi
#   bütün listeyi tek istekle yükler/değiştirir, ekranı yok). Liste kendiliğinden dolmaz; yüklenene kadar boştur.
#   TASK-013: tura geri bildirim (POST /api/assistant/turns/{turnId}/feedback; "Faydalı mı? Evet / Hayır", son seçim geçerli)
#   ve "cevap yok" turundan sonra konuşmanın temsilci kuyruğuna aktarılması (POST /api/assistant/conversations/{conversationId}/handoff;
#   202, konuşma başına tek kayıt, tekrar istek aynı kaydı döner). Gerçek çağrı merkezi yoktur; kayıt assistant veritabanındadır.
# Bilgi bankasına hiçbir belge kendiliğinden girmez: retrieval-api açılışta kaynak, sürüm, parça ya da iş oluşturmaz (TASK-027).
#   Belgeler sadece POST .../sources ile girer. Yeni sürüm yükleme ucu yoktur (kapsam dışı).
# Ortak davranış (TASK-002): iki serviste de tanımsız bir path'e gelen her istek 404 + application/problem+json + errorCode NOT_FOUND döner
#   (ör. GET /api/assistant/yok). web'in nginx'i /api/assistant/ ve /api/workspaces/ dışındaki /api/** isteklerine aynı biçimde 404 NOT_FOUND döner.
# Sağlık ucu (GET /actuator/health, her servisin kendi portunda) işletim ucudur; bu sözleşmenin parçası değildir ve web üzerinden yayınlanmaz.
openapi: 3.1.0
info:
  title: RAG Asistan API
  version: 0.0.0
tags:
  - name: Conversations
    description: Conversations of the Önizleme screen and the streamed answer to each question (assistant-api)
  - name: Turns
    description: Feedback on a single answered turn ("Faydalı mı?") (assistant-api)
  - name: Handoff
    description: Handing a conversation over to the human agent queue after a "not found" answer (assistant-api)
  - name: Live config
    description: The assistant's effective server configuration shown on Önizleme (assistant-api)
  - name: Suggestions
    description: Suggested questions of the Önizleme screen (chips, question list, autocomplete) maintained by the product team (assistant-api)
  - name: Workspaces
    description: The single workspace and its embedding, chunking and index settings (retrieval-api)
  - name: Sources
    description: Knowledge sources of a workspace and their file uploads (retrieval-api)
  - name: Chunks
    description: Chunks of a source's current version (retrieval-api; the chunk dialog of the web)
  - name: Ingestion jobs
    description: Background ingestion jobs of a workspace (retrieval-api)
  - name: Search
    description: Vector search over the current versions of a workspace's sources (retrieval-api; called by assistant-api)
paths:
  /api/assistant/conversations:
    post:
      tags: [Conversations]
      operationId: createConversation
      summary: Open a new conversation
      description: |
        assistant-api. The web calls this when the first question of a conversation is sent (the first question on
        Önizleme, and the first question after "Yeni konuşma"). The id is generated by the server. A conversation without
        turns is never listed anywhere in this task.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConversationRequest'
      responses:
        '201':
          description: The conversation was created
          headers:
            Location:
              description: Path of the conversation, e.g. `/api/assistant/conversations/1`
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'
        '400':
          description: |
            `VALIDATION_FAILED`: `channel` missing — `violations[].field` = `channel`, message `must not be null`.
            `BAD_REQUEST`: body missing or not valid JSON, or `channel` is not one of the enum values (framework)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '415':
          description: '`UNSUPPORTED_MEDIA_TYPE`: the request body is not `application/json` (framework)'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/assistant/conversations/{conversationId}/messages:
    post:
      tags: [Conversations]
      operationId: sendMessage
      summary: Ask a question in a conversation; the answer streams back as Server-Sent Events
      description: |
        assistant-api. Runs the RAG pipeline for the question: query rewrite (TASK-010; see below), retrieval-api search
        with the search query (`topK` = `assistant.retrieval.candidates` for the `rerank` strategy,
        `assistant.retrieval.top-k` for `top5`), rerank with the search query (strategy `rerank` only; when the reranker
        fails the first `top-k` hits in vector order are used and the answer streams normally), prompt with the
        conversation history, the numbered chunks and the customer's own question, answer from the chat model streamed
        token by token, citation parsing, turn record.

        Query rewrite (TASK-010): when `assistant.query-rewrite.enabled` is true and the conversation has at least one
        earlier answered turn (no `errorCode`), the chat model turns the question and the last
        `assistant.history.max-turns` answered turns into a standalone search query. The first turn of a conversation is
        never rewritten. A failed, timed-out, empty or too long rewrite never fails the request: the search uses the
        question as typed and the turn records the outcome (`queryRewriteStatus` in the `sources` event).

        Generation mode (TASK-011): `assistant.generation.mode` is `rag` (default, everything above) or `llm`
        (Sadece LLM). In `llm` mode there is no query rewrite, no retrieval-api search and no rerank: the prompt is the
        short system instruction without chunks, the conversation history and the question as typed; citations are not
        parsed and the "not found" sentence is not detected. The turn is recorded with `generationMode` `LLM_ONLY`,
        `retrievalStrategy` `NONE`, no search query and no chunks. Because nothing is retrieved, `RETRIEVAL_UNAVAILABLE`
        never occurs in this mode and an empty knowledge base does not change the answer. The mode is server
        configuration; changing it needs a restart.

        The response is `200 text/event-stream`. Events, their order and payloads are defined in `docs/api/sse.md`
        (`token`* → `sources` → `done`; `error` ends the stream). The stream is opened only after the query rewrite and
        the retrieval (and rerank) steps have finished, so every error listed below is returned before any event. An
        error after the stream has opened (chat model unavailable, also before its first token) is an `error` event with
        the same `errorCode` vocabulary, not an HTTP status.

        The client must send `Accept: text/event-stream, application/problem+json` so that error responses can be written.

        Check order: 400 → 404 (`CONVERSATION_NOT_FOUND`) → 409 (`TURN_IN_PROGRESS`) → query rewrite (no error) →
        503 (`RETRIEVAL_UNAVAILABLE`) → 200 stream. In `llm` mode: 400 → 404 → 409 → 200 stream.
        A `RETRIEVAL_UNAVAILABLE` turn is recorded with that error code (and the search query and rewrite outcome); 400,
        404 and 409 record nothing.

        Handoff (TASK-013): a conversation that was handed over to the agent queue (`requestHandoff`) still accepts
        questions exactly as before; the handoff record is not changed by later turns.
      parameters:
        - name: conversationId
          in: path
          required: true
          description: Conversation id returned by `createConversation`
          schema:
            type: integer
            format: int64
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '200':
          description: The answer stream (see `docs/api/sse.md`). Headers `Cache-Control: no-cache`, `X-Accel-Buffering: no`.
          content:
            text/event-stream:
              schema:
                type: string
                description: Server-Sent Events; event names and `data` payloads in `docs/api/sse.md`
        '400':
          description: |
            `VALIDATION_FAILED` (`violations[].field` = `text`): missing, empty or only whitespace — message `must not be blank`;
            longer than 1000 characters (Java `String.length()`, before stripping) — message `size must be at most 1000 characters`.
            `BAD_REQUEST`: body missing or not valid JSON, or `conversationId` is not an integer (framework)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: '`CONVERSATION_NOT_FOUND`: no conversation with this id'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: '`TURN_IN_PROGRESS`: an answer is still being produced in this conversation (another request for the same conversation is running)'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '415':
          description: '`UNSUPPORTED_MEDIA_TYPE`: the request body is not `application/json` (framework)'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: |
            `RETRIEVAL_UNAVAILABLE`: retrieval-api could not be used — connection refused, timeout (connect 2 s, read 15 s),
            any non-2xx answer (e.g. its own `EMBEDDING_UNAVAILABLE`) or an unreadable body. retrieval-api's status and
            `errorCode` are not copied into this response.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/assistant/turns/{turnId}/feedback:
    post:
      tags: [Turns]
      operationId: submitFeedback
      summary: Record whether the answer of a turn was helpful ("Faydalı mı? Evet / Hayır")
      description: |
        assistant-api (TASK-013). Stores `helpful` on the turn together with the time of the request
        (`conversation_turns.helpful`, `conversation_turns.feedback_at`). The last request wins: sending `false` after
        `true` replaces it; sending the same value again succeeds and keeps the value. There is no way to remove a
        feedback (no "neutral" value).

        Only a completed turn accepts feedback. A turn is completed when its answer stream ended with `done`, i.e. the
        turn record has no `errorCode`. Turns that ended with `error`, were cancelled by the client (`STREAM_CANCELLED`)
        or failed before the stream (`RETRIEVAL_UNAVAILABLE`) are not completed. A turn whose answer is still streaming
        has no id yet (the turn is recorded when the stream ends, see `docs/api/sse.md`), so it cannot be addressed.
        "Not found" turns (`notFoundAnswer` true) and Sadece LLM turns are completed and accept feedback.

        Concurrent requests for the same turn are applied one after the other; the stored value is the one of the
        request applied last, and no other field of the turn is changed.

        Check order: 400 → 404 (`TURN_NOT_FOUND`) → 409 (`TURN_NOT_COMPLETED`) → 204.
      parameters:
        - name: turnId
          in: path
          required: true
          description: Turn id from the `done` event (`turnId`)
          schema:
            type: integer
            format: int64
            example: 12
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitFeedbackRequest'
      responses:
        '204':
          description: The feedback was stored
        '400':
          description: |
            `VALIDATION_FAILED`: `helpful` missing or null — `violations[].field` = `helpful`, message `must not be null`.
            `BAD_REQUEST`: body missing or not valid JSON, `helpful` has a value the JSON reader cannot convert to a
            boolean (e.g. `"yes"`, an object, an array), or the path `turnId` is not an integer (framework).
            Values the JSON reader converts with its default coercion (e.g. `"true"`, `1` → `true`) are accepted as that
            boolean and are not an error. Clients send a JSON boolean.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: '`TURN_NOT_FOUND`: no turn with this id'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: '`TURN_NOT_COMPLETED`: the turn did not end with `done` (its record has an `errorCode`); nothing is stored'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '415':
          description: '`UNSUPPORTED_MEDIA_TYPE`: the request body is not `application/json` (framework)'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/assistant/conversations/{conversationId}/handoff:
    post:
      tags: [Handoff]
      operationId: requestHandoff
      summary: Put the conversation into the human agent queue after a "not found" answer
      description: |
        assistant-api (TASK-013). The web calls this from the "Temsilciye bağlan" button, which is shown only under a
        completed "not found" answer. There is no real contact center: the handoff is a record in the assistant
        database (`handoffs`: conversation, the turn that triggered it, reason, queue, time). No agent answer is ever
        produced.

        The handoff is per conversation and is created at most once. The queue is the configured
        `assistant.handoff.queue` (`bireysel`); the reason is always `NO_ANSWER`.
        - First valid request: the record is created; `202` with it.
        - Any later valid request for the same conversation (also concurrent ones, also with another "not found" turn
          of the same conversation): nothing is created or changed; `202` with the existing record (its `turnId` and
          `createdAt` are those of the first request).

        The turn must belong to the conversation, be completed (no `errorCode`) and be a "not found" turn
        (`notFoundAnswer` true; never the case for Sadece LLM turns). A handed-off conversation keeps accepting
        questions (`sendMessage`).

        Check order: 400 → 404 (`CONVERSATION_NOT_FOUND`) → 404 (`TURN_NOT_FOUND`) → 409 (`HANDOFF_NOT_ALLOWED`) → 202.
      parameters:
        - name: conversationId
          in: path
          required: true
          description: Conversation id returned by `createConversation`
          schema:
            type: integer
            format: int64
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestHandoffRequest'
      responses:
        '202':
          description: The conversation is in the agent queue (created now or earlier). No `Location` header; there is no endpoint to read a handoff.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandoffResponse'
        '400':
          description: |
            `VALIDATION_FAILED` (`violations[].field` = `turnId` or `reason`): missing or null — message `must not be null`.
            `BAD_REQUEST`: body missing or not valid JSON, `reason` is not one of the enum values, `turnId` has a value
            the JSON reader cannot convert to an integer (e.g. `"abc"`, an object, an array), or the path
            `conversationId` is not an integer (framework). Values the JSON reader converts with its default coercion
            (e.g. `"12"`, `12.5` → `12`) are accepted as that integer and are not an error. Clients send a JSON integer.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: |
            `CONVERSATION_NOT_FOUND`: no conversation with this id.
            `TURN_NOT_FOUND`: no turn with this id in this conversation (also when the turn belongs to another conversation)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: '`HANDOFF_NOT_ALLOWED`: the turn is not a completed "not found" turn (it has an answer, ended with an `errorCode`, or is a Sadece LLM turn); nothing is stored'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '415':
          description: '`UNSUPPORTED_MEDIA_TYPE`: the request body is not `application/json` (framework)'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/assistant/live-config:
    get:
      tags: [Live config]
      operationId: getLiveConfig
      summary: Get the assistant's effective configuration, the reranker status and the knowledge base status
      description: |
        assistant-api (TASK-011). Read by the Önizleme screen for its configuration strip and the "Asistan nasıl
        cevaplıyor?" card (and by Değerlendirme in TASK-016). Read-only: the configuration cannot be changed through the
        API; it comes from `assistant.*` / `spring.ai.ollama.*` and environment variables and changes with a restart.

        - `chatModel`, `generationMode`, `retrievalStrategy`, `candidates`, `topK`, `queryRewriteEnabled` are the
          configured values (`retrievalStrategy` is the configured one, `TOP_K` or `RERANK`, also in `LLM_ONLY` mode).
        - `rerankerStatus` is the last measured reachability of the reranker (see `RerankerStatus`).
        - `embeddingModel`, `embeddingDimensions` and `knowledgeBase` come from retrieval-api at request time
          (`GET /api/workspaces/{workspaceId}` and every page of `GET /api/workspaces/{workspaceId}/sources` with
          `size=100`), with the workspace id `assistant.workspace-id` (42) and the retrieval-api client's timeouts
          (connect 2 s, read 15 s). Any failure of these calls (connection refused, timeout, non-2xx, unreadable body)
          does not fail this request: `knowledgeBase.status` is `UNAVAILABLE`, `embeddingModel`,
          `embeddingDimensions` and `knowledgeBase.searchableSourceCount` are null and `knowledgeBase.sources` is empty.
        - The response is not cached by the server; every call reads retrieval-api again.
      responses:
        '200':
          description: The effective configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveConfigResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/assistant/suggestions:
    get:
      tags: [Suggestions]
      operationId: getSuggestions
      summary: Get the whole suggested question list (categories, questions, follow-ups)
      description: |
        assistant-api (TASK-012). Read by the Önizleme screen for the suggestion chips, the "Kayıtlı sorular" dialog and
        the autocomplete list; the web does all matching itself. Returns the set stored by the last successful
        `replaceSuggestions`, in the order it was sent (categories, questions in a category, follow-ups of a question).
        Before the first upload, and after an upload with `categories: []`, the set is empty
        (`questionCount` 0, `followUpCount` 0, `categories` []). Nothing is ever added automatically: there is no seed
        data and no generated suggestion. Not paginated: the set is bounded by the upload limits (at most 500 questions,
        5 follow-ups each).
      responses:
        '200':
          description: The current suggestion set (possibly empty)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuggestionSetResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Suggestions]
      operationId: replaceSuggestions
      summary: Replace the whole suggested question list with the given one
      description: |
        assistant-api (TASK-012). Used by the product team (e.g. `curl -X PUT ... -d @suggestions.json`); the web never
        calls it and there is no screen for it. The request is the complete new list: everything stored before is
        removed and the given categories, questions and follow-ups are stored in the given order, in one transaction.
        Concurrent calls are serialized; the result is always exactly one of the sent lists, never a mix. A request that
        fails validation changes nothing. `categories: []` clears the list.

        Texts are stripped of leading and trailing whitespace before they are stored; case, Turkish letters and inner
        punctuation are kept. "Normalized" below means: lower-cased with Turkish rules (`İ` → `i`, `I` → `ı`), every
        character that is not a letter, digit or whitespace replaced by a space, runs of whitespace collapsed to one
        space, stripped — the same normalization the web uses for matching.

        Validation (all problems are reported together in `violations`):
        - `categories`: required (`must not be null`), at most 50 (`size must be at most 50`), no null element
          (`categories[i]`, `must not be null`); all categories together at most 500 questions (`categories`,
          `total questions must be at most 500`).
        - `categories[i].name`: not blank (`must not be blank`), at most 40 characters before stripping
          (`size must be at most 40 characters`), unique among categories after normalization (`must be unique`; reported on
          the later duplicate).
        - `categories[i].questions`: at least one (`must not be empty`), no null element.
        - `categories[i].questions[j].text`: not blank, at most 200 characters before stripping
          (`size must be at most 200 characters`), unique among all questions of the set after normalization
          (`must be unique`; reported on the later duplicate, in category then question order).
        - `categories[i].questions[j].starter`: optional boolean, default `false`.
        - `categories[i].questions[j].followUps`: optional, default []; at most 5 (`size must be at most 5`); each element
          (`categories[i].questions[j].followUps[k]`) not blank, at most 200 characters before stripping, unique within the
          question after normalization (`must be unique`) and not equal to its own question after normalization
          (`must differ from the question`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceSuggestionsRequest'
      responses:
        '200':
          description: The list was replaced; the body is the stored set (same as a following `getSuggestions`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuggestionSetResponse'
        '400':
          description: |
            `VALIDATION_FAILED`: see the rules above; `violations[].field` is the property path, e.g.
            `categories[0].questions[2].text` or `categories[1].questions[0].followUps[3]`.
            `BAD_REQUEST`: body missing or not valid JSON, or a value has the wrong JSON type (framework)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '415':
          description: '`UNSUPPORTED_MEDIA_TYPE`: the request body is not `application/json` (framework)'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/workspaces/{workspaceId}:
    get:
      tags: [Workspaces]
      operationId: getWorkspace
      summary: Get the workspace with its embedding model and the current chunking and index settings
      description: |
        retrieval-api. Used by the Bilgi kaynakları screen (info box under the source list, meta boxes of the source
        detail) and by assistant-api's `getLiveConfig` (embedding model and dimensions, TASK-011). Name and embedding model come from the `workspaces` row; the chunking settings are the service's
        current `ingestion.*` configuration (they apply to every version ingested with that configuration); the
        vector index is the one created by the migrations (HNSW, cosine).
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: The workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceResponse'
        '400':
          description: '`BAD_REQUEST`: `workspaceId` is not an integer (framework)'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: '`WORKSPACE_NOT_FOUND`: no workspace with this id (only 42 exists)'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/workspaces/{workspaceId}/search:
    post:
      tags: [Search]
      operationId: searchChunks
      summary: Return the chunks nearest to a query text, from the current version of every source
      description: |
        retrieval-api. Called by assistant-api in its retrieval step (lab: `topK` 5 for top-5, 20 for rerank candidates).
        Vector search only (no keyword or hybrid mode). Nothing is stored: searches are not recorded.

        The query is stripped (leading/trailing whitespace) and embedded with the workspace's embedding model (`bge-m3`).
        The search covers, for every source of the workspace, only the chunks of its current version (the version of its
        latest DONE job). A source with no DONE version is not searched.

        Hits are ordered by cosine distance ascending; equal distances are ordered by `chunkId` ascending.
        At most `topK` hits are returned; fewer when the workspace has fewer searchable chunks. There is no distance
        threshold: a query whose answer is not in any source still gets the nearest chunks.
        When no source has a current version the response is an empty list and the embedding model is not called.

        The query uses the HNSW index (`hnsw.ef_search` = 40).

        Check order: 400 → 404 → 409 → (empty knowledge base → 200 with no hits) → 503.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchChunksRequest'
      responses:
        '200':
          description: The nearest chunks, nearest first (possibly none)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          description: |
            `VALIDATION_FAILED` (`violations[].field`; all violations are reported together, in no fixed order):
            - `query`: missing, empty or only whitespace — message `must not be blank`; longer than 1000 characters — message `size must be at most 1000 characters`
            - `topK`: missing — message `must not be null`; not in 1-50 — message `must be between 1 and 50`

            `BAD_REQUEST`: body missing or not valid JSON, `topK` not a number, or `workspaceId` not an integer (framework)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: '`WORKSPACE_NOT_FOUND`: no workspace with this id (only 42 exists)'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: '`EMBEDDING_MODEL_MISMATCH`: the configured embedding model (`embedding.model@embedding.dimensions`) is not the workspace''s (`bge-m3@1024`)'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '415':
          description: '`UNSUPPORTED_MEDIA_TYPE`: the request body is not `application/json` (framework)'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: |
            - `EMBEDDING_UNAVAILABLE`: the embedding model did not answer, answered with an error or returned no vector (after retries; with the model server down this takes about 3 seconds)
            - `EMBEDDING_DIMENSION_MISMATCH`: the embedding model returned a vector whose size is not the workspace's (1024)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/workspaces/{workspaceId}/sources:
    get:
      tags: [Sources]
      operationId: listSources
      summary: List the sources of a workspace, ordered by id
      description: |
        retrieval-api. Fixed order `id ASC`. A freshly started system returns an empty page (nothing is ingested on startup).
        Also called by assistant-api's `getLiveConfig` (TASK-011): a source counts as searchable when `chunkCount` is
        not null (it has a current version).
        Each item carries the fields of the Bilgi kaynakları table (see `SourceResponse`), including the source's latest
        ingestion job, so a client can show the running stage and poll that job.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: One page of sources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceResponsePage'
        '400':
          description: '`VALIDATION_FAILED`: `page` < 0 or `size` not in 1-100 (`violations[].field` = `page` / `size`); `BAD_REQUEST`: `workspaceId` is not an integer (framework)'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: '`WORKSPACE_NOT_FOUND`: no workspace with this id (only 42 exists)'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Sources]
      operationId: createSource
      summary: Create a source from an uploaded PDF and start its first ingestion job
      description: |
        retrieval-api. Returns 202 at once; the job runs in the background and is polled at `Location`
        (`GET .../ingestion-jobs/{jobId}`). The job goes QUEUED → PARSING → CHUNKING → EMBEDDING → WRITING → DONE, or FAILED.

        Check order: 413 (multipart limit, before the controller) → 400 (request parts) → 415 (file type) → 422 (PDF content)
        → 404 (workspace) → 409. Any 4xx writes nothing: no source, no job, the name stays free.

        Name rules: the `name` part is stripped (leading/trailing whitespace). When it is missing or blank, the file name
        without its last extension is used (stripped; if longer than 80 characters, its first 80 characters, stripped again).
        The resulting name must be 2-80 characters (Unicode code points), otherwise `VALIDATION_FAILED` with field `name`.
        Names are unique in the workspace ignoring case (`lower(name)`): "Rehber" and " REHBER " are the same name.
        An existing name is always `SOURCE_NAME_TAKEN`, whatever the state of that source (a source whose first job
        failed is retried with `retryIngestion`, not re-uploaded).

        Version rules: required; stripped; 1-40 characters.

        File rules: required, not empty, at most 20 MB (20 × 1024 × 1024 bytes). Accepted type: PDF only — the file name
        ends with `.pdf` (any case) and the first 1024 bytes contain `%PDF-`. The PDF is then read during the request;
        a PDF that cannot be opened, has no extractable text or has no bookmarks (PDF outline) is rejected with 422.
        Headings are never guessed from the page text.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateSourceRequest'
      responses:
        '202':
          description: Job accepted; it runs in the background
          headers:
            Location:
              description: URL of the ingestion job (same as `statusUrl`), e.g. `/api/workspaces/42/ingestion-jobs/1`
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionJobResponse'
        '400':
          description: |
            `VALIDATION_FAILED` (`violations[].field`):
            - `file`: part missing, empty (0 bytes) or its file name longer than 255 characters — message `must not be empty` / `file name must be at most 255 characters`
            - `name`: resulting name not 2-80 characters — message `size must be between 2 and 80`
            - `version`: part missing or blank — message `must not be blank`; stripped value longer than 40 characters — message `size must be between 1 and 40`

            `BAD_REQUEST`: `workspaceId` is not an integer (framework)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: '`WORKSPACE_NOT_FOUND`: no workspace with this id (only 42 exists)'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: |
            - `SOURCE_NAME_TAKEN`: a source with this name (ignoring case) already exists, in any state; also when two uploads with the same name race and the other one wins
            - `EMBEDDING_MODEL_MISMATCH`: the configured embedding model (`embedding.model@embedding.dimensions`) is not the workspace's (`bge-m3@1024`); nothing is written
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '413':
          description: '`FILE_TOO_LARGE`: the file is larger than 20 MB'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '415':
          description: |
            - `UNSUPPORTED_FILE_TYPE`: the file name does not end with `.pdf` or the content has no `%PDF-` signature in its first 1024 bytes
            - `UNSUPPORTED_MEDIA_TYPE`: the request is not `multipart/form-data` (framework)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: |
            The file is a PDF but cannot be ingested; checked in this order:
            - `PDF_UNREADABLE`: the PDF cannot be opened (corrupt or encrypted)
            - `PDF_NO_TEXT`: no page has extractable text (e.g. a scanned image)
            - `PDF_NO_BOOKMARKS`: the PDF has no bookmarks with a title and a page, or no text lies under any bookmark
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/workspaces/{workspaceId}/sources/{sourceId}:
    get:
      tags: [Sources]
      operationId: getSource
      summary: Get one source with the fields of the source detail screen
      description: retrieval-api. Same `SourceResponse` as in `listSources`.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/SourceId'
      responses:
        '200':
          description: The source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceResponse'
        '400':
          description: '`BAD_REQUEST`: `workspaceId` or `sourceId` is not an integer (framework)'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: '`WORKSPACE_NOT_FOUND`: no workspace with this id; `SOURCE_NOT_FOUND`: no source with this id in the workspace'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/workspaces/{workspaceId}/sources/{sourceId}/file:
    get:
      tags: [Sources]
      operationId: getSourceFile
      summary: Download the stored PDF of a source, for viewing in the browser
      description: |
        retrieval-api. Returns the PDF of the source's current version (the file of the job that produced
        `active_version_id`). A source without a current version (first ingestion running or failed) returns the file
        of its latest job. The bytes are returned exactly as uploaded.

        Headers: `Content-Type: application/pdf`, `Content-Disposition: inline` carrying the stored file name
        (RFC 6266; `filename*` in UTF-8 when the name is not ASCII), `X-Content-Type-Options: nosniff`, `Cache-Control: no-store`.
        The web opens this URL in a new tab ("PDF'i aç"); the browser's PDF viewer shows it.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/SourceId'
      responses:
        '200':
          description: The PDF bytes
          headers:
            Content-Disposition:
              description: '`inline` with the stored file name, e.g. `inline; filename="Rasit-Bankasi-Urun-Hizmet-Rehberi-2026.10.pdf"`'
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                contentMediaType: application/pdf
        '400':
          description: '`BAD_REQUEST`: `workspaceId` or `sourceId` is not an integer (framework)'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: '`WORKSPACE_NOT_FOUND`: no workspace with this id; `SOURCE_NOT_FOUND`: no source with this id in the workspace'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/workspaces/{workspaceId}/sources/{sourceId}/chunks:
    get:
      tags: [Chunks]
      operationId: listChunks
      summary: List the chunks of a source's current version, optionally filtered by heading or text
      description: |
        retrieval-api. Only chunks of the source's current version (`active_version_id`) are listed; a source without a
        current version returns an empty page. Fixed order `chunkNo ASC`.

        Filter (`query`): stripped; missing or blank means no filter. Otherwise a chunk matches when the normalized
        query is a substring of the normalized text `heading + ' ' + content`. Normalization (same on both sides):
        Turkish lower case (`I` → `ı`, `İ` → `i`, then lower case: "ASGARİ ÖDEME" = "asgari ödeme"), every run of
        whitespace (spaces, line breaks) becomes one space. Punctuation is kept as is. `totalElements` is the number of
        matching chunks.

        Check order: 400 → 404.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/SourceId'
        - name: query
          in: query
          required: false
          description: Filter text; at most 200 characters (Java `String.length()`, before stripping)
          schema:
            type: string
            maxLength: 200
            example: asgari ödeme
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: One page of chunks (possibly empty)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChunkSummaryResponsePage'
        '400':
          description: |
            `VALIDATION_FAILED` (`violations[].field`): `query` longer than 200 characters — message `size must be at most 200 characters`;
            `page` < 0 or `size` not in 1-100 (`page` / `size`).
            `BAD_REQUEST`: `workspaceId`, `sourceId`, `page` or `size` is not an integer (framework)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: '`WORKSPACE_NOT_FOUND`: no workspace with this id; `SOURCE_NOT_FOUND`: no source with this id in the workspace'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/workspaces/{workspaceId}/chunks/{chunkId}:
    get:
      tags: [Chunks]
      operationId: getChunk
      summary: Get one chunk with its full text and the first values of its embedding
      description: |
        retrieval-api. Used by the chunk dialog (Bilgi kaynakları; from TASK-008 also from citations in Önizleme).
        Any chunk of the workspace is returned, also one of a source version that is no longer current.
        The full vector is never returned: only its first 8 values (`embeddingPreview`) and its size (`embeddingDimensions`).
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: chunkId
          in: path
          required: true
          description: Chunk id
          schema:
            type: integer
            format: int64
            example: 151
      responses:
        '200':
          description: The chunk
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChunkResponse'
        '400':
          description: '`BAD_REQUEST`: `workspaceId` or `chunkId` is not an integer (framework)'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: '`WORKSPACE_NOT_FOUND`: no workspace with this id; `CHUNK_NOT_FOUND`: no chunk with this id in the workspace'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/workspaces/{workspaceId}/sources/{sourceId}/ingestion-jobs:
    get:
      tags: [Sources]
      operationId: listIngestionJobs
      summary: List the ingestion jobs of a source, newest first
      description: retrieval-api. Fixed order `id DESC` (newest first). Every job of the source, in any stage.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/SourceId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: One page of jobs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionJobResponsePage'
        '400':
          description: '`VALIDATION_FAILED`: `page` < 0 or `size` not in 1-100 (`violations[].field` = `page` / `size`); `BAD_REQUEST`: a path or query parameter is not an integer (framework)'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: '`WORKSPACE_NOT_FOUND`: no workspace with this id; `SOURCE_NOT_FOUND`: no source with this id in the workspace'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Sources]
      operationId: retryIngestion
      summary: Start a new ingestion job for a source whose ingestion never completed, from its stored PDF
      description: |
        retrieval-api. For a source that has no completed version and no active job (its jobs all FAILED, e.g.
        `EMBEDDING_UNAVAILABLE` or `INGESTION_INTERRUPTED`). The new job reuses the PDF, file name and version label of the
        source's latest job; no body is sent. Returns 202 at once, like `createSource`. The source keeps its id.

        Check order: 404 (workspace, source) → 409.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/SourceId'
      responses:
        '202':
          description: Job accepted; it runs in the background
          headers:
            Location:
              description: URL of the new ingestion job (same as `statusUrl`)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionJobResponse'
        '400':
          description: '`BAD_REQUEST`: `workspaceId` or `sourceId` is not an integer (framework)'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: '`WORKSPACE_NOT_FOUND`: no workspace with this id; `SOURCE_NOT_FOUND`: no source with this id in the workspace'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: |
            - `SOURCE_ALREADY_INGESTED`: the source has a completed version (uploading a new version is out of scope)
            - `INGESTION_IN_PROGRESS`: the source has an active job (also when two retries race)
            - `EMBEDDING_MODEL_MISMATCH`: the configured embedding model is not the workspace's; nothing is written
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/workspaces/{workspaceId}/ingestion-jobs/{jobId}:
    get:
      tags: [Ingestion jobs]
      operationId: getIngestionJob
      summary: Get the stage and progress of an ingestion job
      description: |
        retrieval-api. Polled while the job runs. Stages advance QUEUED → PARSING → CHUNKING → EMBEDDING → WRITING → DONE;
        on error the job becomes FAILED, keeps the stage it failed in (`failedStage`) and carries a fixed `errorCode`
        (`IngestionErrorCode`). Chunks are written in a single transaction at WRITING; a FAILED job never leaves chunks behind.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: jobId
          in: path
          required: true
          description: Ingestion job id
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        '200':
          description: The job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionJobResponse'
        '400':
          description: '`BAD_REQUEST`: `workspaceId` or `jobId` is not an integer (framework)'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: '`WORKSPACE_NOT_FOUND`: no workspace with this id (only 42 exists); `INGESTION_JOB_NOT_FOUND`: no job with this id in the workspace'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      description: Workspace id. There is exactly one workspace, 42 ("Raşit Bankası · Dijital Asistan").
      schema:
        type: integer
        format: int64
        example: 42
    SourceId:
      name: sourceId
      in: path
      required: true
      description: Source id
      schema:
        type: integer
        format: int64
        example: 10001
    Page:
      name: page
      in: query
      required: false
      description: Zero-based page index. `VALIDATION_FAILED` if < 0.
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      description: Page size, 1-100. `VALIDATION_FAILED` if outside the range.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
  responses:
    ValidationFailed:
      description: '`VALIDATION_FAILED`: request validation failed (`violations[].field` names the field)'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotFound:
      description: '`NOT_FOUND`: no endpoint at this path (framework). Domain "not found" codes are added by the task that introduces them.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    InternalError:
      description: '`INTERNAL_ERROR`: unexpected server error'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
  schemas:
    Channel:
      type: string
      description: Where a conversation was opened. This project has a single channel, Önizleme (`PREVIEW`).
      enum: [PREVIEW]
    CreateConversationRequest:
      type: object
      description: Body of `createConversation`. Unknown fields are ignored.
      required: [channel]
      properties:
        channel:
          $ref: '#/components/schemas/Channel'
    ConversationResponse:
      type: object
      required: [conversationId, channel, createdAt]
      properties:
        conversationId:
          type: integer
          format: int64
          description: Server-generated id (identity sequence starting at 1)
          example: 1
        channel:
          $ref: '#/components/schemas/Channel'
        createdAt:
          type: string
          format: date-time
    SendMessageRequest:
      type: object
      description: Body of `sendMessage`. Unknown fields are ignored.
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 1000
          description: |
            The customer's question, free text. Must contain a non-whitespace character; at most 1000 characters
            (Java `String.length()`, counted before stripping). Stripped before it is searched, sent to the model and
            stored; case and Turkish letters are kept as sent.
          example: Kartımı kaybettim, ne yapmalıyım?
    SubmitFeedbackRequest:
      type: object
      description: Body of `submitFeedback`. Unknown fields are ignored.
      required: [helpful]
      properties:
        helpful:
          type: boolean
          description: '`true` = "Evet" (the answer was helpful), `false` = "Hayır"'
          example: false
    HandoffReason:
      type: string
      description: Why the conversation was handed over. `NO_ANSWER` = the assistant answered with the fixed "not found" sentence. The only value.
      enum: [NO_ANSWER]
    RequestHandoffRequest:
      type: object
      description: Body of `requestHandoff`. Unknown fields are ignored.
      required: [turnId, reason]
      properties:
        turnId:
          type: integer
          format: int64
          description: The "not found" turn under which "Temsilciye bağlan" was pressed (`done.turnId`)
          example: 12
        reason:
          $ref: '#/components/schemas/HandoffReason'
    HandoffResponse:
      type: object
      description: The conversation's handoff record (the same one for every request of the conversation)
      required: [conversationId, turnId, reason, queue, createdAt]
      properties:
        conversationId:
          type: integer
          format: int64
          example: 1
        turnId:
          type: integer
          format: int64
          description: The turn of the first successful request
          example: 12
        reason:
          $ref: '#/components/schemas/HandoffReason'
        queue:
          type: string
          description: Agent queue the conversation waits in (`assistant.handoff.queue`)
          example: bireysel
        createdAt:
          type: string
          format: date-time
          description: When the handoff was first recorded
      example:
        conversationId: 1
        turnId: 12
        reason: NO_ANSWER
        queue: bireysel
        createdAt: '2026-11-02T10:31:05Z'
    GenerationMode:
      type: string
      description: |
        How answers are produced (`assistant.generation.mode`): `RAG` (`rag`, default) searches the knowledge base and
        answers from the numbered chunks; `LLM_ONLY` (`llm`, Sadece LLM) sends the question to the chat model without
        retrieval and without chunks.
      enum: [RAG, LLM_ONLY]
    RerankerStatus:
      type: string
      description: |
        Last measured reachability of the reranker (TASK-011).
        - `UP`: the last measurement succeeded.
        - `DOWN`: the last measurement failed (no connection, timeout, non-2xx, unusable answer).
        - `UNKNOWN`: nothing has been measured since assistant-api started.
        - `NOT_USED`: the reranker is not part of the configuration (`generationMode` `LLM_ONLY` or `retrievalStrategy`
          `TOP_K`); it is not measured.
        A measurement is either the periodic health check (`GET {assistant.reranker.base-url}/health` every
        `assistant.reranker.health-check-interval`, 15 s; 2xx → `UP`) or a rerank call made for a question (success →
        `UP`, failure that falls back to vector order → `DOWN`); the latest one wins.
      enum: [UP, DOWN, UNKNOWN, NOT_USED]
    KnowledgeBaseStatus:
      type: string
      description: |
        - `READY`: at least one source has a current version (is searchable).
        - `EMPTY`: retrieval-api answered and no source is searchable (no source, or only sources whose first ingestion
          is running or failed).
        - `UNAVAILABLE`: retrieval-api could not be read.
      enum: [READY, EMPTY, UNAVAILABLE]
    KnowledgeBaseSource:
      type: object
      description: A searchable source (one with a current version)
      required: [sourceId, name, version]
      properties:
        sourceId:
          type: integer
          format: int64
          example: 10001
        name:
          type: string
          example: Raşit Bankası Ürün ve Hizmet Rehberi
        version:
          type: string
          description: Version label of the current version
          example: '2026.10'
    KnowledgeBaseResponse:
      type: object
      required: [status, searchableSourceCount, sources]
      properties:
        status:
          $ref: '#/components/schemas/KnowledgeBaseStatus'
        searchableSourceCount:
          type: [integer, 'null']
          format: int32
          description: Number of searchable sources; null when `UNAVAILABLE`
          example: 1
        sources:
          type: array
          description: All searchable sources, ordered by `sourceId` ascending; empty when `EMPTY` or `UNAVAILABLE`
          items:
            $ref: '#/components/schemas/KnowledgeBaseSource'
    LiveConfigResponse:
      type: object
      description: Body of `getLiveConfig`
      required: [chatModel, embeddingModel, embeddingDimensions, generationMode, retrievalStrategy, candidates, topK, queryRewriteEnabled, rerankerStatus, knowledgeBase]
      properties:
        chatModel:
          type: string
          description: Configured chat model (`spring.ai.ollama.chat.model`)
          example: qwen3.5:9b
        embeddingModel:
          type: [string, 'null']
          description: The workspace's embedding model (retrieval-api `WorkspaceResponse.embeddingModel`); null when retrieval-api could not be read
          example: bge-m3
        embeddingDimensions:
          type: [integer, 'null']
          format: int32
          description: The workspace's embedding dimensions; null when retrieval-api could not be read
          example: 1024
        generationMode:
          $ref: '#/components/schemas/GenerationMode'
        retrievalStrategy:
          type: string
          description: Configured retrieval strategy (`assistant.retrieval.strategy`; `top5` → `TOP_K`, `rerank` → `RERANK`). Reported also in `LLM_ONLY` mode, where it is not applied
          enum: [TOP_K, RERANK]
        candidates:
          type: integer
          format: int32
          description: '`assistant.retrieval.candidates`'
          example: 20
        topK:
          type: integer
          format: int32
          description: '`assistant.retrieval.top-k`'
          example: 5
        queryRewriteEnabled:
          type: boolean
          description: '`assistant.query-rewrite.enabled`'
          example: true
        rerankerStatus:
          $ref: '#/components/schemas/RerankerStatus'
        knowledgeBase:
          $ref: '#/components/schemas/KnowledgeBaseResponse'
      example:
        chatModel: qwen3.5:9b
        embeddingModel: bge-m3
        embeddingDimensions: 1024
        generationMode: RAG
        retrievalStrategy: RERANK
        candidates: 20
        topK: 5
        queryRewriteEnabled: true
        rerankerStatus: UP
        knowledgeBase:
          status: READY
          searchableSourceCount: 1
          sources:
            - sourceId: 10001
              name: Raşit Bankası Ürün ve Hizmet Rehberi
              version: '2026.10'
    ReplaceSuggestionsRequest:
      type: object
      description: Body of `replaceSuggestions`; the complete new list. Unknown fields are ignored.
      required: [categories]
      properties:
        categories:
          type: array
          maxItems: 50
          description: Categories in display order. At most 500 questions in total.
          items:
            $ref: '#/components/schemas/SuggestionCategoryRequest'
      example:
        categories:
          - name: Kartlar
            questions:
              - text: Kartımı kaybettim, ne yapmalıyım?
                starter: true
                followUps: [Yenisi kaç günde gelir?]
              - text: Gold kartın yıllık aidatı ne kadar?
                followUps: [Peki Platinum'da?]
          - name: Krediler
            questions:
              - text: Asgari ödeme tutarı nasıl hesaplanır?
                starter: true
    SuggestionCategoryRequest:
      type: object
      required: [name, questions]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
          description: Category heading shown in the "Kayıtlı sorular" dialog. Stripped; unique (normalized).
          example: Kartlar
        questions:
          type: array
          minItems: 1
          description: Questions of the category in display order
          items:
            $ref: '#/components/schemas/SuggestedQuestionRequest'
    SuggestedQuestionRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 200
          description: The question as it is shown and asked. Stripped; unique in the whole set (normalized).
          example: Kartımı kaybettim, ne yapmalıyım?
        starter:
          type: boolean
          default: false
          description: Shown first among the start chips of an empty conversation
        followUps:
          type: array
          maxItems: 5
          default: []
          description: Follow-up questions offered (in this order) after this question was answered in the same conversation
          items:
            type: string
            minLength: 1
            maxLength: 200
          example: [Yenisi kaç günde gelir?]
    SuggestionSetResponse:
      type: object
      description: The stored suggestion set
      required: [questionCount, followUpCount, categories]
      properties:
        questionCount:
          type: integer
          format: int32
          description: Number of questions over all categories (follow-ups not included); the N of "Kayıtlı sorular · N soru, M takip"
          example: 3
        followUpCount:
          type: integer
          format: int32
          description: Number of follow-ups over all questions; the M of "Kayıtlı sorular · N soru, M takip"
          example: 2
        categories:
          type: array
          description: Categories in the uploaded order; empty when nothing has been uploaded
          items:
            $ref: '#/components/schemas/SuggestionCategoryResponse'
      example:
        questionCount: 3
        followUpCount: 2
        categories:
          - name: Kartlar
            questions:
              - text: Kartımı kaybettim, ne yapmalıyım?
                starter: true
                followUps: [Yenisi kaç günde gelir?]
              - text: Gold kartın yıllık aidatı ne kadar?
                starter: false
                followUps: [Peki Platinum'da?]
          - name: Krediler
            questions:
              - text: Asgari ödeme tutarı nasıl hesaplanır?
                starter: true
                followUps: []
    SuggestionCategoryResponse:
      type: object
      required: [name, questions]
      properties:
        name:
          type: string
          example: Kartlar
        questions:
          type: array
          description: In the uploaded order; never empty
          items:
            $ref: '#/components/schemas/SuggestedQuestionResponse'
    SuggestedQuestionResponse:
      type: object
      required: [text, starter, followUps]
      properties:
        text:
          type: string
          example: Kartımı kaybettim, ne yapmalıyım?
        starter:
          type: boolean
          example: true
        followUps:
          type: array
          description: In the uploaded order; empty when none
          items:
            type: string
          example: [Yenisi kaç günde gelir?]
    ProblemDetail:
      type: object
      description: RFC 9457 Problem Details with the project's `errorCode` extension
      required: [type, title, status, errorCode]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
          description: English, for humans only. Clients decide by `errorCode`.
        instance:
          type: string
        errorCode:
          type: string
          description: Stable error code. Domain codes are added by the task that introduces them.
          enum:
            - VALIDATION_FAILED
            - BAD_REQUEST
            - NOT_FOUND
            - METHOD_NOT_ALLOWED
            - NOT_ACCEPTABLE
            - UNSUPPORTED_MEDIA_TYPE
            - INTERNAL_ERROR
            - WORKSPACE_NOT_FOUND
            - INGESTION_JOB_NOT_FOUND
            - SOURCE_NAME_TAKEN
            - EMBEDDING_MODEL_MISMATCH
            - FILE_TOO_LARGE
            - UNSUPPORTED_FILE_TYPE
            - PDF_UNREADABLE
            - PDF_NO_TEXT
            - PDF_NO_BOOKMARKS
            - SOURCE_NOT_FOUND
            - SOURCE_ALREADY_INGESTED
            - INGESTION_IN_PROGRESS
            - EMBEDDING_UNAVAILABLE
            - EMBEDDING_DIMENSION_MISMATCH
            - CHUNK_NOT_FOUND
            - CONVERSATION_NOT_FOUND
            - TURN_IN_PROGRESS
            - RETRIEVAL_UNAVAILABLE
            - CHAT_MODEL_UNAVAILABLE
            - TURN_NOT_FOUND
            - TURN_NOT_COMPLETED
            - HANDOFF_NOT_ALLOWED
        violations:
          type: array
          description: Only for `VALIDATION_FAILED`
          items:
            $ref: '#/components/schemas/Violation'
    Violation:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          example: page
        message:
          type: string
          description: Fixed English message
          example: must be greater than or equal to 0
    IngestionStage:
      type: string
      description: QUEUED → PARSING → CHUNKING → EMBEDDING → WRITING → DONE; FAILED on error
      enum: [QUEUED, PARSING, CHUNKING, EMBEDDING, WRITING, DONE, FAILED]
    IngestionErrorCode:
      type: string
      description: |
        Why a job is FAILED. Not an HTTP error; carried in the job body.
        File problems are rejected at upload (422, same codes), so a job normally fails only for a temporary reason
        (`EMBEDDING_UNAVAILABLE`, `INGESTION_INTERRUPTED`). The three PDF codes stay here for a stored file that can no longer be parsed.
        - `PDF_UNREADABLE`: the PDF cannot be opened (corrupt, encrypted)
        - `PDF_NO_TEXT`: no page has extractable text
        - `PDF_NO_BOOKMARKS`: no usable bookmarks, or no text under them
        - `EMBEDDING_UNAVAILABLE`: the embedding model did not answer, answered with an error or returned a wrong number of vectors (after retries)
        - `EMBEDDING_DIMENSION_MISMATCH`: the embedding model returned a vector whose size is not the workspace's (1024)
        - `EMBEDDING_MODEL_MISMATCH`: the configured embedding model is not the workspace's (`bge-m3@1024`)
        - `INGESTION_INTERRUPTED`: the service stopped while the job was active; marked on the next start
        - `INTERNAL_ERROR`: unexpected error
      enum:
        - PDF_UNREADABLE
        - PDF_NO_TEXT
        - PDF_NO_BOOKMARKS
        - EMBEDDING_UNAVAILABLE
        - EMBEDDING_DIMENSION_MISMATCH
        - EMBEDDING_MODEL_MISMATCH
        - INGESTION_INTERRUPTED
        - INTERNAL_ERROR
    IngestionJobResponse:
      type: object
      description: One ingestion job (one file, one version label)
      required: [jobId, workspaceId, sourceId, version, fileName, stage, failedStage, progress, embeddedChunks, totalChunks, errorCode, createdAt, startedAt, finishedAt, statusUrl]
      properties:
        jobId:
          type: integer
          format: int64
          example: 1
        workspaceId:
          type: integer
          format: int64
          example: 42
        sourceId:
          type: integer
          format: int64
          example: 10001
        version:
          type: string
          description: Version label given with the upload (stripped, 1-40 characters); a retry job copies it from the previous job
          example: '2026.10'
        fileName:
          type: string
          example: Rasit-Bankasi-Urun-Hizmet-Rehberi-2026.10.pdf
        stage:
          $ref: '#/components/schemas/IngestionStage'
        failedStage:
          description: The stage the job was in when it failed; null unless `stage` is FAILED
          oneOf:
            - $ref: '#/components/schemas/IngestionStage'
            - type: 'null'
        progress:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: |
            QUEUED 0, PARSING 0.05, CHUNKING 0.1, EMBEDDING 0.1 + 0.8 × embeddedChunks / totalChunks, WRITING 0.9, DONE 1.0.
            A FAILED job keeps the value it had when it failed.
          example: 0.1
        embeddedChunks:
          type: integer
          format: int32
          description: Chunks embedded so far. Chunks are not written until WRITING.
          example: 0
        totalChunks:
          type: [integer, 'null']
          format: int32
          description: Number of chunks of the document; null until CHUNKING finishes
          example: 152
        errorCode:
          description: Null unless `stage` is FAILED
          oneOf:
            - $ref: '#/components/schemas/IngestionErrorCode'
            - type: 'null'
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: [string, 'null']
          format: date-time
          description: When PARSING started
        finishedAt:
          type: [string, 'null']
          format: date-time
          description: When the job became DONE or FAILED. For a DONE job this is the source version's "last sync" time.
        statusUrl:
          type: string
          description: This resource's path (same as the `Location` header of `createSource` and `retryIngestion`)
          example: /api/workspaces/42/ingestion-jobs/1
    SourceKind:
      type: string
      description: Kind of the uploaded file. Only PDF is accepted.
      enum: [PDF]
    IngestionJobResponsePage:
      type: object
      description: '`PageResponse<IngestionJobResponse>`'
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/IngestionJobResponse'
        page:
          type: integer
          format: int32
          example: 0
        size:
          type: integer
          format: int32
          example: 20
        totalElements:
          type: integer
          format: int64
          example: 1
        totalPages:
          type: integer
          format: int32
          example: 1
    WorkspaceResponse:
      type: object
      description: The workspace, its embedding model and the current chunking and index settings
      required: [workspaceId, name, embeddingModel, embeddingDimensions, targetChunkChars, maxChunkChars, overlapChars, vectorIndexType, distanceMetric]
      properties:
        workspaceId:
          type: integer
          format: int64
          example: 42
        name:
          type: string
          example: Raşit Bankası · Dijital Asistan
        embeddingModel:
          type: string
          description: Embedding model name of the workspace (`workspaces.embedding_model`)
          example: bge-m3
        embeddingDimensions:
          type: integer
          format: int32
          example: 1024
        targetChunkChars:
          type: integer
          format: int32
          description: '`ingestion.target-chunk-chars`'
          example: 1600
        maxChunkChars:
          type: integer
          format: int32
          description: '`ingestion.max-chunk-chars`'
          example: 2000
        overlapChars:
          type: integer
          format: int32
          description: '`ingestion.overlap-chars`'
          example: 200
        vectorIndexType:
          type: string
          description: Index of the embedding column (fixed by the migrations)
          enum: [HNSW]
        distanceMetric:
          type: string
          description: Distance used by the index and the search (fixed by the migrations)
          enum: [COSINE]
    SourceResponse:
      type: object
      description: |
        One knowledge source with the fields of the Bilgi kaynakları table and the source detail header.
        "Current version" = the version of `active_version_id` (the latest DONE job). The file fields (`fileName`,
        `fileSizeBytes`, `version`) come from the current version; a source without a current version (first ingestion
        running or failed) takes them from its latest job. The count fields are null until the source has a current version.
      required: [sourceId, workspaceId, name, kind, createdAt, fileName, fileSizeBytes, version, pageCount, chapterCount, chunkCount, averageTokenCount, syncedAt, latestJob]
      properties:
        sourceId:
          type: integer
          format: int64
          description: Ids come from a sequence that starts at 10001
          example: 10001
        workspaceId:
          type: integer
          format: int64
          example: 42
        name:
          type: string
          minLength: 2
          maxLength: 80
          example: Raşit Bankası Ürün ve Hizmet Rehberi
        kind:
          $ref: '#/components/schemas/SourceKind'
        createdAt:
          type: string
          format: date-time
        fileName:
          type: string
          description: File name of the current version, else of the latest job
          example: Rasit-Bankasi-Urun-Hizmet-Rehberi-2026.10.pdf
        fileSizeBytes:
          type: integer
          format: int64
          description: File size in bytes of the current version, else of the latest job
          example: 412873
        version:
          type: string
          description: Version label of the current version, else of the latest job
          example: '2026.10'
        pageCount:
          type: [integer, 'null']
          format: int32
          description: PDF pages of the current version; null without a current version
          example: 70
        chapterCount:
          type: [integer, 'null']
          format: int32
          description: Top-level bookmarks (chapters) of the current version; null without a current version
          example: 11
        chunkCount:
          type: [integer, 'null']
          format: int32
          description: Chunks of the current version; null without a current version
          example: 154
        averageTokenCount:
          type: [integer, 'null']
          format: int32
          description: Average `tokenCount` of the current version's chunks, rounded half up; null without a current version
          example: 285
        syncedAt:
          type: [string, 'null']
          format: date-time
          description: When the current version's job became DONE ("son senkron"); null without a current version
        latestJob:
          $ref: '#/components/schemas/IngestionJobResponse'
          description: The source's newest ingestion job (highest `jobId`). Every source has at least one job.
    ChunkSummaryResponse:
      type: object
      description: One row of the chunk table. The embedding is not included.
      required: [chunkId, chunkNo, pageNumber, heading, content, tokenCount]
      properties:
        chunkId:
          type: integer
          format: int64
          example: 151
        chunkNo:
          type: integer
          format: int32
          description: Zero-based position of the chunk within its source version
          example: 31
        pageNumber:
          type: integer
          format: int32
          description: PDF page of the chunk's first line
          example: 19
        heading:
          type: string
          example: 2.16 Kayıp ya da çalıntı bildirimi
        content:
          type: string
          description: Full chunk text as stored (1-2000 characters), without the heading
        tokenCount:
          type: integer
          format: int32
          example: 297
    ChunkSummaryResponsePage:
      type: object
      description: '`PageResponse<ChunkSummaryResponse>`'
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ChunkSummaryResponse'
        page:
          type: integer
          format: int32
          example: 1
        size:
          type: integer
          format: int32
          example: 12
        totalElements:
          type: integer
          format: int64
          description: Number of chunks matching the filter (all chunks of the current version without a filter)
          example: 154
        totalPages:
          type: integer
          format: int32
          example: 13
    ChunkResponse:
      type: object
      description: One chunk for the chunk dialog. The full vector is never returned.
      required: [chunkId, chunkNo, pageNumber, heading, content, tokenCount, embeddingModel, embeddingDimensions, embeddingPreview, sourceId, sourceName, version]
      properties:
        chunkId:
          type: integer
          format: int64
          example: 151
        chunkNo:
          type: integer
          format: int32
          example: 31
        pageNumber:
          type: integer
          format: int32
          example: 19
        heading:
          type: string
          example: 2.16 Kayıp ya da çalıntı bildirimi
        content:
          type: string
          description: Full chunk text as stored, without the heading
        tokenCount:
          type: integer
          format: int32
          example: 297
        embeddingModel:
          type: string
          description: Model label the chunk was embedded with (`chunks.embedding_model`)
          example: bge-m3@1024
        embeddingDimensions:
          type: integer
          format: int32
          description: Size of the stored vector
          example: 1024
        embeddingPreview:
          type: array
          description: The first 8 values of the stored vector, in order
          minItems: 8
          maxItems: 8
          items:
            type: number
            format: float
          example: [0.01085661, -0.0019320842, -0.06578231, 0.0136360405, -0.017394094, -0.03013522, 0.012087691, -0.046693146]
        sourceId:
          type: integer
          format: int64
          example: 10001
        sourceName:
          type: string
          example: Raşit Bankası Ürün ve Hizmet Rehberi
        version:
          type: string
          description: Version label of the source version the chunk belongs to
          example: '2026.10'
    SourceResponsePage:
      type: object
      description: '`PageResponse<SourceResponse>`'
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/SourceResponse'
        page:
          type: integer
          format: int32
          example: 0
        size:
          type: integer
          format: int32
          example: 20
        totalElements:
          type: integer
          format: int64
          example: 0
        totalPages:
          type: integer
          format: int32
          example: 0
    CreateSourceRequest:
      type: object
      description: Multipart parts of `createSource`
      required: [file, version]
      properties:
        file:
          type: string
          contentMediaType: application/pdf
          description: The PDF with bookmarks and extractable text. Not empty, at most 20 MB, file name ends with `.pdf`, at most 255 characters.
        name:
          type: string
          description: Optional source name. Stripped; when missing or blank, the file name without extension is used. Result 2-80 characters, unique ignoring case.
          example: Raşit Bankası Ürün ve Hizmet Rehberi
        version:
          type: string
          description: Required version label of this file. Stripped; 1-40 characters.
          example: '2026.10'
    SearchChunksRequest:
      type: object
      description: Body of `searchChunks`. Unknown fields are ignored.
      required: [query, topK]
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 1000
          description: |
            Text to search for. Must contain a non-whitespace character; at most 1000 characters (Java `String.length()`,
            UTF-16 code units, counted before stripping). Stripped before embedding; case and Turkish letters are kept as sent.
          example: Kartımı kaybettim, ne yapmalıyım?
        topK:
          type: integer
          format: int32
          minimum: 1
          maximum: 50
          description: 'Maximum number of hits to return (lab: 5 for top-5, 20 for rerank candidates)'
          example: 5
    SearchResponse:
      type: object
      description: Result of `searchChunks`
      required: [hits]
      properties:
        hits:
          type: array
          description: Nearest first (cosine distance ascending, then `chunkId` ascending); at most `topK`; empty when nothing is searchable
          items:
            $ref: '#/components/schemas/SearchHitResponse'
    SearchHitResponse:
      type: object
      description: One chunk returned by a search. The embedding vector itself is never returned.
      required: [chunkId, chunkNo, pageNumber, heading, content, sourceId, sourceName, version, distance]
      properties:
        chunkId:
          type: integer
          format: int64
          example: 151
        chunkNo:
          type: integer
          format: int32
          description: Zero-based position of the chunk within its source version
          example: 31
        pageNumber:
          type: integer
          format: int32
          description: PDF page of the chunk's first line
          example: 19
        heading:
          type: string
          description: Section heading of the chunk (1-200 characters)
          example: 2.16 Kayıp ya da çalıntı bildirimi
        content:
          type: string
          description: Chunk text as stored (1-2000 characters), without the heading
        sourceId:
          type: integer
          format: int64
          example: 10001
        sourceName:
          type: string
          example: Raşit Bankası Ürün ve Hizmet Rehberi
        version:
          type: string
          description: Version label of the source version the chunk belongs to (the label given at upload)
          example: '2026.10'
        distance:
          type: number
          format: double
          minimum: 0
          maximum: 2
          description: Cosine distance between the query embedding and the chunk embedding (pgvector `<=>`); smaller is nearer
          example: 0.3124
